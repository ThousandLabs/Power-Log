<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="description" content="Power Log — comprendre et réduire sa consommation d'électricité (Woyofal / Senelec), 100 % hors ligne.">
<title>Power Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Power Log">
<!--
  ============================================================================
  POWER LOG — Suivi de consommation électrique (compteurs prépayés Woyofal)
  par Thousand Labs
  ----------------------------------------------------------------------------
  • Fichier unique : HTML + CSS + JavaScript embarqués (aucune dépendance).
  • 100 % local : toutes les données restent dans le navigateur (localStorage).
  • Hors ligne, sans compte, sans serveur. Sauvegarde / restauration par fichier.
  • Activation par code lié à l'appareil (signature ECDSA, codes générés
    avec Thousand Admin). L'appli ne contient que la clé PUBLIQUE.
  • Installable (PWA) : manifest.webmanifest + sw.js.

  Modules :
    1. Moteur des tranches (grille paramétrable, TVA, taxe communale, redevance)
    2. Moteur de consommation (relevés + soldes avant recharge)
    3. Inventaire des appareils + table de référence + import par texte + scan d'étiquette (OCR)
    4. Calculateur avant recharge, vérificateur de ticket, simulateur d'achat
    5. Mode détective (mesure au clignotant du compteur), chasse à la veille
    6. Plusieurs compteurs, partage de facture, budget du mois
    7. Rappels contextuels, statistiques, guide, lexique
    8. Langues : français, anglais, wolof
  ============================================================================
-->
<style>
/* ======================= 1. THÈME ======================= */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --surface2:#f8f6f3; --border:#e7e2db;
  --text:#1c1917; --muted:#6b645c;
  --primary:#c2410c; --primary-soft:#ffedd5; --on-primary:#fff;
  --green:#15803d; --green-soft:#dcfce7;
  --red:#dc2626;   --red-soft:#fee2e2;
  --amber:#b45309; --amber-soft:#fef3c7;
  --blue:#2563eb;  --blue-soft:#dbeafe;
  --violet:#6d28d9;--violet-soft:#ede9fe;
  --bar:#ea580c; --bar2:#fdba74;
  --radius:16px;
  --shadow:0 1px 2px rgba(28,25,23,.04),0 6px 20px rgba(28,25,23,.05);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0f0d0b; --surface:#1a1714; --surface2:#141210; --border:#2c2722;
  --text:#f2ede7; --muted:#a59c92;
  --primary:#fb923c; --primary-soft:#3b2112; --on-primary:#1c0d03;
  --green:#4ade80; --green-soft:#12301c;
  --red:#f87171;   --red-soft:#3d1414;
  --amber:#fbbf24; --amber-soft:#3a2a08;
  --blue:#60a5fa;  --blue-soft:#14254a;
  --violet:#a78bfa;--violet-soft:#291d4d;
  --bar:#fb923c; --bar2:#7c3a12;
  --shadow:none;
  color-scheme:dark;
}

/* ======================= 2. BASE ======================= */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.ic{flex-shrink:0;display:block}
b,strong{font-weight:700}
.hidden{display:none!important}

/* ======================= 3. MISE EN PAGE ======================= */
.app{display:flex;min-height:100vh}
.sidebar{display:none;position:sticky;top:0;height:100vh;width:250px;flex-shrink:0;flex-direction:column;gap:2px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 16px;letter-spacing:-.02em}
.brand-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#f59e0b,#c2410c);display:grid;place-items:center;color:#fff;flex-shrink:0}
.nav-btn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;text-align:left;width:100%}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary)}
.nav-sep{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 12px 4px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
main{flex:1;min-width:0}
#view{max-width:1100px;margin:0 auto;padding:12px 16px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.meter-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:13px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:5px 0;min-width:0}
.bn-btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn-btn.active{color:var(--primary)}
.bn-add{width:54px;height:54px;margin:-24px auto 2px;border-radius:17px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 8px 20px rgba(194,65,12,.35)}
@media(min-width:900px){.sidebar{display:flex}.bottomnav{display:none}#view{padding:26px 32px 60px}}

/* ======================= 4. COMPOSANTS ======================= */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.page-head h1{font-size:24px;letter-spacing:-.025em;line-height:1.15}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sub{color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:750;letter-spacing:-.01em}
.card h3{font-size:14.5px;font-weight:750}
.section{margin-top:22px}
.section-title{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 15px}
.stat .k{font-size:12px;font-weight:650;color:var(--muted)}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.hero{background:linear-gradient(135deg,#9a3412 0%,#c2410c 55%,#ea580c 100%);color:#fff;border:0}
.hero .k{opacity:.88;font-size:13px;font-weight:600}
.hero .sub,.hero .hint{color:rgba(255,255,255,.85)}
.hero-row{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;opacity:.96}
.hero-foot{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:13px}
.big{font-size:34px;font-weight:850;letter-spacing:-.035em;line-height:1.1}
.big-s{font-size:20px;font-weight:800;letter-spacing:-.02em}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)} .muted{color:var(--muted)}
.mt-s{margin-top:6px}.mt{margin-top:12px}.mt-l{margin-top:20px}
.flex{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.nowrap{white-space:nowrap}
.right{text-align:right}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-weight:650;font-size:14px;text-align:center;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.07)}
.btn-danger{color:var(--red)}
.btn-sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn-block{display:flex;width:100%}
.btn-wa{background:#25d366;border-color:#25d366;color:#fff}
a.btn{text-decoration:none}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.link-btn{color:var(--primary);font-weight:700;font-size:14px;text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:650}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.label{font-size:12.5px;font-weight:700;color:var(--muted)}
.input{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);outline:none;font-size:15px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.input{min-height:90px;resize:vertical;line-height:1.4}
.input-xl{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary);flex-shrink:0}
select.input{appearance:auto}

/* Listes */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .g{flex:1;min-width:0}
.li .g b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .g small{display:block;color:var(--muted);font-size:12.5px}
.li-ic{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--border);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv.total{font-weight:800;border-top:1px solid var(--border)}

/* Badges & alertes */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:750;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.b-gray{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.alert{padding:12px 14px;border-radius:13px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.alert .a-ic{font-size:17px;line-height:1.2;flex-shrink:0}
.alert-red{background:var(--red-soft);color:var(--text);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.alert-amber{background:var(--amber-soft);color:var(--text);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.alert-green{background:var(--green-soft);color:var(--text);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.alert-blue{background:var(--blue-soft);color:var(--text);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.alert-violet{background:var(--violet-soft);color:var(--text);border-color:color-mix(in srgb,var(--violet) 30%,transparent)}
.alerts{display:flex;flex-direction:column;gap:8px}

/* Jauges */
.gauge{height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);overflow:hidden;display:flex}
.gauge i{display:block;height:100%}
.gauge-wrap{position:relative}
.gauge-marks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
.tr-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-top:8px}
.tr-legend span{display:inline-flex;align-items:center;gap:6px}
.tr-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--primary)}

/* Graphiques */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:2}
.chart .tip.show{opacity:1}
.axis{fill:var(--muted);font-size:10px}
.gridl{stroke:var(--border);stroke-width:1}

/* Tableaux */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:750;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t input.input{min-height:36px;padding:6px 8px;font-size:14px}

/* Modale */
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.modal-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:640px){.modal-panel{left:50%;top:50%;bottom:auto;width:min(560px,94vw);border-radius:22px;transform:translate(-50%,-50%);animation:pop .2s ease}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-head h3{font-size:17px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.more-grid .nav-btn{flex-direction:column;gap:6px;padding:12px 4px;text-align:center;font-size:12.5px;border:1px solid var(--border);justify-content:center}
.more-grid .nav-btn .emo{font-size:22px}

/* Toasts */
.toasts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--text);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center}
.toast.err{background:var(--red);color:#fff}.toast.warn{background:var(--amber);color:#fff}
@media(min-width:900px){.toasts{bottom:28px}}

/* Écran d'activation */
#lock{display:none}
body.locked #lock{display:block}
body.locked .app,body.locked .bottomnav{display:none}
.lock-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 15% 0%,var(--primary-soft),transparent 55%),var(--bg)}
.lock-card{width:100%;max-width:450px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:15px}
.lock-title{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.steps{display:flex;flex-direction:column;gap:9px;font-size:14px}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.trial-box{background:var(--primary-soft);border:1.5px solid var(--primary);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:center}
.dev-box{background:var(--surface2);border:1px dashed var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dev-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:800;letter-spacing:.08em}
.lock-foot{text-align:center;font-size:13px;color:var(--muted)}
.code-area{min-height:84px;font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
.shake{animation:shake .35s}
.scan-box{border:1.5px dashed var(--border);border-radius:14px;padding:12px;background:var(--surface2)}
.scan-box #scanRes:not(:empty){margin-top:10px}
.scan-status{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.scan-status small{color:var(--muted)}
.scan-raw{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:160px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;margin-top:6px}
.input.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--primary);border-color:var(--primary)}100%{box-shadow:none}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.lang-row{display:flex;gap:6px;justify-content:center}

/* Guide & lexique */
.guide-item{border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.guide-item summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.guide-item summary::-webkit-details-marker{display:none}
.guide-item summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:500}
.guide-item[open] summary::after{content:"−"}
.guide-body{padding:0 16px 16px;font-size:14px}
.guide-body p+p,.guide-body p+ul,.guide-body p+ol,.guide-body ul+p,.guide-body ol+p,.guide-body .alert+p,.guide-body p+.alert{margin-top:8px}
.guide-body ul,.guide-body ol{padding-left:20px;display:flex;flex-direction:column;gap:5px}
.guide-body code,.mono-box{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 5px}
.mono-box{display:block;padding:10px 12px;white-space:pre-wrap;word-break:break-word;border-radius:10px}
.lex{padding:12px 0;border-top:1px solid var(--border)}
.lex:first-child{border-top:0}
.lex b{font-size:15px}

/* Détective */
.tap-btn{width:100%;min-height:150px;border-radius:24px;background:var(--primary);color:var(--on-primary);font-size:22px;font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tap-btn small{font-size:13px;font-weight:600;opacity:.9}
.tap-btn:active{transform:scale(.98);filter:brightness(1.1)}
.det-step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.det-step:first-child{border-top:0}
.det-step .n{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.det-step.done .n{background:var(--green-soft);color:var(--green)}

/* QR */

'use strict';
/* =========================================================================
   1. UTILITAIRES
   ========================================================================= */
const $ = s => document.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
// Montants en francs : « 5.000 », « 10.000 », « 1.500.000 », « 5 000 F » = milliers ; les kWh gardent leurs décimales (num).
const money = v => { const t = String(v ?? '').replace(/[\s\u202f\u00a0]/g, '').replace(/[^\d.,-]/g, ''); if (/^-?[1-9]\d{0,2}([.,]\d{3})+$/.test(t)) return num(t.replace(/[.,]/g, '')); const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.'); return num(lc > -1 && ld > -1 ? (lc > ld ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '')) : t); };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dtstr = d => `${dstr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const today = () => dstr(new Date());
const nowLocal = () => dtstr(new Date());
const ymOf = s => String(s).slice(0, 7);
const curYM = () => today().slice(0, 7);
const parseDT = s => { const [d, t] = String(s).split('T'); const [y, m, dd] = d.split('-').map(Number); const [hh, mi] = (t || '12:00').split(':').map(Number); return new Date(y, m - 1, dd, hh || 0, mi || 0).getTime(); };
const DAY = 86400000;
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftYM = (ym, k) => { const [y, m] = ym.split('-').map(Number); return dstr(new Date(y, m - 1 + k, 1)).slice(0, 7); };
const LOCALE = () => ({fr: 'fr-FR', en: 'en-GB', wo: 'fr-FR'}[lang()] || 'fr-FR');
const nf = (n, d = 0) => (isFinite(n) ? Number(n).toLocaleString(LOCALE(), {maximumFractionDigits: d, minimumFractionDigits: 0}) : '∞');
const F = n => nf(Math.round(n)) + ' F';

const fmtDate = s => { try { return new Date(parseDT(s)).toLocaleDateString(LOCALE(), {day: 'numeric', month: 'short', year: 'numeric'}); } catch (e) { return s; } };
const fmtDT = s => { try { return new Date(parseDT(s)).toLocaleString(LOCALE(), {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}); } catch (e) { return s; } };
const monthName = ym => { const [y, m] = ym.split('-').map(Number); const s = new Date(y, m - 1, 1).toLocaleDateString(LOCALE(), {month: 'long', year: 'numeric'}); return s.charAt(0).toUpperCase() + s.slice(1); };
const monthShort = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(LOCALE(), {month: 'short'}).replace('.', ''); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
// Sauvegarde : ouvre le menu de partage du téléphone (WhatsApp, Drive, e-mail…) ; sinon téléchargement classique.

/* =========================================================================
   2. GRILLES TARIFAIRES OFFICIELLES (Senelec, CRSE décision n°2025-140,

const OFFICIAL = {

};

const clone = o => JSON.parse(JSON.stringify(o));

const REF = [

const REFK = Object.fromEntries(REF.map(r => [r.k, r]));
const refOf = k => REFK[k] || REFK.autre;
// Puissance estimée selon la taille (CV pour les clims, pouces pour les télés, litres pour les frigos)
function sizedWatts(k, size) {
  const s = num(size); if (!s) return refOf(k).w;
  if (k === 'clim' || k === 'clim_inv') return Math.round(s * 900);
  if (k === 'tv') return Math.round(clamp(s * 1.4, 20, 250));

  if (k === 'frigo_old') return Math.round(100 + s * .4);
  if (k === 'congel') return Math.round(90 + s * .35);

}

/* =========================================================================
   4. DONNÉES (localStorage)
   ========================================================================= */
const KEY = 'powerlog_data';
const defaultMeter = () => ({id: uid(), name: 'Maison', profile: 'DPP', number: '', budget: 0, people: [], created: today()});
function defaults() {
  const m = defaultMeter();
  return {
    v: 1,
    settings: {lang: '', theme: 'auto', cur: m.id, profiles: clone(OFFICIAL), pulse: 1600, lastBackup: 0, onboarded: false, dismissed: {}},
    meters: [m], appliances: [], recharges: [], readings: [], measures: [], offsets: {}
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return defaults();
    const d = JSON.parse(raw), base = defaults();
    const out = Object.assign(base, d);
    out.settings = Object.assign(base.settings, d.settings || {});

    out.meters.forEach(m => { if (!m.people) m.people = []; if (!m.profile) m.profile = 'DPP'; });
    return out;
  } catch (e) { return defaults(); }
}
let D = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch (e) { toast(t('Sauvegarde impossible : stockage du navigateur plein ou bloqué.'), 'err'); }
}
const meter = () => D.meters.find(m => m.id === D.settings.cur) || D.meters[0];
const profOf = m => D.settings.profiles[(m || meter()).profile] || D.settings.profiles.DPP || OFFICIAL.DPP;
const appsOf = (mid = meter().id) => D.appliances.filter(a => a.meterId === mid);
const rechOf = (mid = meter().id) => D.recharges.filter(r => r.meterId === mid).sort((a, b) => parseDT(a.date) - parseDT(b.date));
const readOf = (mid = meter().id) => D.readings.filter(r => r.meterId === mid).sort((a, b) => parseDT(a.date) - parseDT(b.date));

/* =========================================================================
   5. MOTEUR DES TRANCHES
   -------------------------------------------------------------------------
   Le principe Woyofal : le prix d'un kWh dépend du TOTAL de kWh ACHETÉS
   depuis le 1er du mois (pas de ce que vous avez consommé). Le compteur
   des tranches revient à zéro chaque 1er du mois.
   ========================================================================= */
// Découpe [cum, ∞[ en segments de prix constant (bornes des tranches + seuil TVA)
function segments(P, cum) {
  const cuts = new Set([cum]);
  let prev = 0;
  P.tranches.forEach(tr => { if (tr.to != null && tr.to > cum) cuts.add(tr.to); });
  if (num(P.tva) > 0 && P.tvaFrom > cum) cuts.add(num(P.tvaFrom));
  const pts = [...cuts].sort((a, b) => a - b);
  const segs = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = i + 1 < pts.length ? pts[i + 1] : Infinity;
    const ti = trancheIndex(P, a + 1e-9), tr = P.tranches[ti];
    const tvaOn = num(P.tva) > 0 && a + 1e-9 >= num(P.tvaFrom);
    const p = num(tr.p), eff = p * (1 + num(P.tco) / 100) + (tvaOn ? p * num(P.tva) / 100 : 0);
    segs.push({a, b, ti, p, eff, tvaOn});
    prev = b;
  }
  return segs;
}
function trancheIndex(P, kwh) {
  for (let i = 0; i < P.tranches.length; i++) { const to = P.tranches[i].to; if (to == null || kwh <= to) return i; }
  return P.tranches.length - 1;
}
const trancheLabel = (P, i) => { const lo = i ? P.tranches[i - 1].to : 0, to = P.tranches[i].to; return `T${i + 1} · ${to == null ? '> ' + nf(lo) : nf(lo) + '–' + nf(to)} kWh`; };
// Prix réel (taxes comprises) du prochain kWh, selon le cumul acheté du mois
const priceAt = (P, cum) => segments(P, cum)[0].eff;
// Coût de k kWh achetés à partir du cumul « cum »
function costOf(P, cum, k, first) {
  const out = {kwh: k, ht: 0, tco: 0, tva: 0, redev: first ? num(P.redev) : 0, timbre: k > 0 ? num(P.timbre) : 0, parts: []};
  let left = k;
  for (const s of segments(P, cum)) {
    if (left <= 0) break;
    const q = Math.min(left, s.b - s.a); left -= q;
    const ht = q * s.p; out.ht += ht; out.tco += ht * num(P.tco) / 100; if (s.tvaOn) out.tva += ht * num(P.tva) / 100;
    addPart(out.parts, s, q, ht);
  }
  out.total = out.ht + out.tco + out.tva + out.redev + out.timbre;
  return out;
}
function addPart(parts, s, q, ht) {
  const last = parts[parts.length - 1];
  if (last && last.ti === s.ti) { last.kwh += q; last.ht += ht; last.tva = last.tva || s.tvaOn; }
  else parts.push({ti: s.ti, kwh: q, ht, p: s.p, tva: s.tvaOn});
}
// kWh obtenus pour un montant donné
function kwhFor(P, cum, money, first) {
  const out = {money, kwh: 0, ht: 0, tco: 0, tva: 0, redev: 0, timbre: 0, parts: []};
  let net = money;
  if (first) { out.redev = Math.min(net, num(P.redev)); net -= out.redev; }
  if (net > 0 && num(P.timbre)) { out.timbre = Math.min(net, num(P.timbre)); net -= out.timbre; }
  for (const s of segments(P, cum)) {
    if (net <= 1e-9) break;
    const cap = (s.b - s.a) * s.eff, spend = Math.min(net, cap), q = spend / s.eff;
    net -= spend; out.kwh += q;
    const ht = q * s.p; out.ht += ht; out.tco += ht * num(P.tco) / 100; if (s.tvaOn) out.tva += ht * num(P.tva) / 100;
    addPart(out.parts, s, q, ht);
  }
  out.endCum = cum + out.kwh;
  return out;
}

/* Cumul de kWh achetés dans un mois (recharges + achats hors appli déclarés) */
function boughtIn(ym, mid = meter().id, beforeTs = Infinity, excludeId) {
  return sum(rechOf(mid).filter(r => ymOf(r.date) === ym && parseDT(r.date) < beforeTs && r.id !== excludeId), r => num(r.kwh)) + num(D.offsets[mid + '|' + ym]);
}
const spentIn = (ym, mid = meter().id) => sum(rechOf(mid).filter(r => ymOf(r.date) === ym), r => num(r.amount));
const isFirstOfMonth = (ym, mid = meter().id, beforeTs = Infinity, excludeId) => !rechOf(mid).some(r => ymOf(r.date) === ym && parseDT(r.date) < beforeTs && r.id !== excludeId) && !num(D.offsets[mid + '|' + ym]);
// Combien de kWh / de F reste-t-il dans la tranche en cours
function trancheRoom(P, cum) {
  const i = trancheIndex(P, cum + 1e-9), to = P.tranches[i].to;
  if (to == null) return {i, kwh: Infinity, money: Infinity};
  const k = Math.max(0, to - cum);
  return {i, kwh: k, money: costOf(P, cum, k, false).total};
}

/* =========================================================================
   6. MOTEUR DE CONSOMMATION
   -------------------------------------------------------------------------
   Chaque relevé donne le solde du compteur ; chaque recharge donne le solde
   AVANT recharge + les kWh reçus. Consommation entre deux points =
   solde après le point 1 − solde avant le point 2.
   ========================================================================= */
function consumption(mid = meter().id) {
  const ev = [
    ...readOf(mid).map(r => ({t: parseDT(r.date), before: num(r.solde), after: num(r.solde), kind: 'read', id: r.id})),
    ...rechOf(mid).filter(r => r.before !== '' && r.before != null).map(r => ({t: parseDT(r.date), before: num(r.before), after: num(r.before) + num(r.kwh), kind: 'rech', id: r.id}))
  ].sort((a, b) => a.t - b.t || (a.kind === 'read' ? -1 : 1));
  // Les recharges sans solde « avant » cassent la chaîne : on les note
  const blind = rechOf(mid).filter(r => r.before === '' || r.before == null).map(r => parseDT(r.date));
  const iv = [], issues = [];
  for (let i = 1; i < ev.length; i++) {
    const a = ev[i - 1], b = ev[i];
    if (blind.some(x => x > a.t && x < b.t)) continue;
    const days = (b.t - a.t) / DAY; if (days < 0.01) continue;
    const kwh = a.after - b.before;
    if (kwh < -0.3) { issues.push({a, b, kwh}); continue; }
    iv.push({t1: a.t, t2: b.t, days, kwh: Math.max(0, kwh), rate: Math.max(0, kwh) / days});
  }
  // Répartition jour par jour
  const daily = {}, cover = {};
  iv.forEach(x => {
    let t = x.t1;
    while (t < x.t2 - 1) {
      const d = new Date(t), end = Math.min(x.t2, new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime());
      const k = dstr(d), frac = (end - t) / DAY;
      daily[k] = (daily[k] || 0) + x.rate * frac; cover[k] = (cover[k] || 0) + frac;
      t = end;
    }
  });
  const rates = iv.filter(x => x.days >= .4).map(x => x.rate).sort((a, b) => a - b);
  const median = rates.length ? rates[Math.floor(rates.length / 2)] : 0;
  const anomalies = iv.filter(x => x.days >= .4 && median > 0 && x.rate > Math.max(median * 1.45, median + 1.2));
  const avgOver = days => { const from = Date.now() - days * DAY; let k = 0, d = 0; iv.forEach(x => { const a = Math.max(x.t1, from), b = x.t2; if (b > a) { const f = (b - a) / (x.t2 - x.t1); k += x.kwh * f; d += (b - a) / DAY; } }); return d >= .5 ? {avg: k / d, days: d} : null; };
  const avgReal = avgOver(14) || avgOver(45) || avgOver(400);
  const last = ev[ev.length - 1] || null;
  return {ev, iv, daily, cover, median, anomalies, issues, avgReal, last};
}
// Estimation théorique d'un appareil (kWh/jour)
function appKwhDay(a) {
  const q = Math.max(0, num(a.qty) || 1), h = clamp(num(a.hours), 0, 24), duty = a.duty != null && a.duty !== '' ? num(a.duty) : refOf(a.type).duty;
  const sb = a.sb != null && a.sb !== '' ? num(a.sb) : refOf(a.type).sb;
  return q * (num(a.watts) * h * duty + sb * (24 - h)) / 1000;
}
const appStandbyDay = a => { const q = Math.max(0, num(a.qty) || 1), sb = a.sb != null && a.sb !== '' ? num(a.sb) : refOf(a.type).sb; return q * sb * (24 - clamp(num(a.hours), 0, 24)) / 1000; };
const appName = a => (!a.name || a.name === refOf(a.type).n) ? t(refOf(a.type).n) : a.name;
const estDaily = (mid = meter().id) => sum(appsOf(mid), appKwhDay);

/* Synthèse complète pour le compteur sélectionné */
function snapshot(mid = meter().id) {
  const m = D.meters.find(x => x.id === mid), P = profOf(m), ym = curYM();
  const C = consumption(mid), est = estDaily(mid);
  const avg = C.avgReal ? C.avgReal.avg : est;
  const avgSource = C.avgReal ? 'real' : (est > 0 ? 'est' : 'none');
  let solde = null, soldeAt = null;
  if (C.last) {
    const since = (Date.now() - C.last.t) / DAY;
    solde = Math.max(0, C.last.after - avg * Math.max(0, since)); soldeAt = C.last.t;
  }
  const daysLeft = solde != null && avg > 0 ? solde / avg : null;
  const bought = boughtIn(ym, mid), spent = spentIn(ym, mid);
  const room = trancheRoom(P, bought);
  const price = priceAt(P, bought);
  const monthCons = sum(Object.entries(C.daily).filter(([d]) => d.startsWith(ym)), ([, v]) => v);
  const dom = new Date().getDate(), dim = daysInMonth(ym), daysToEnd = dim - dom + 1;
  const projMonthKwh = avg * dim;
  const projMonthCost = costOf(P, 0, projMonthKwh, true).total;
  const lastReadAge = C.last ? (Date.now() - C.last.t) / DAY : null;
  return {m, P, ym, C, est, avg, avgSource, solde, soldeAt, daysLeft, bought, spent, room, price, monthCons, dom, dim, daysToEnd, projMonthKwh, projMonthCost, lastReadAge};
}

  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];

    for(let a=0;a<n;a++){let rr=1,rc=1;for(let b=1;b<=n;b++){if(b<n&&M[a][b]===M[a][b-1])rr++;else{if(rr>=5)p+=rr-2;rr=1}if(b<n&&M[b][a]===M[b-1][a])rc++;else{if(rc>=5)p+=rc-2;rc=1}}}

  function encode(text,e){e=e||'L';const bytes=Array.from(new TextEncoder().encode(text));let v=1,cap=0;

    const nb=BLK[e][v],el=ECC[e][v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];

    const size=v*4+17,M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}

    const ap=alignPos(v),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFmt=m=>{const d=FMT[e]<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));

    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bt);setF(c,a,bt)}}

  function canvas(text,px,e){const q=encode(text,e),n=q.length,quiet=4,total=n+quiet*2,scale=Math.max(2,Math.floor((px||300)/total)),c=document.createElement('canvas');

    for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++)if(q[y][xx])x.fillRect((xx+quiet)*scale,(y+quiet)*scale,scale,scale);c.className='qr';return c}
  return {encode,canvas};
})();

/* Lecteur : BarcodeDetector (Android/Chrome) sinon jsQR chargé à la demande (puis gardé hors ligne) */
let scanStream=null,scanTimer=null;
function loadJsQR(){return new Promise((ok,ko)=>{if(window.jsQR)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=()=>window.jsQR?ok():ko();s.onerror=ko;document.head.appendChild(s)})}
async function startScan(video,status,onText){
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='📵 Caméra non disponible ici. Ouvrez l\'appli installée (site en https).';return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){status.textContent='📵 Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.';return}
  video.setAttribute('playsinline','');video.muted=true;video.srcObject=scanStream;try{await video.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(video);return r.length?r[0].rawValue:null}}catch(e){detect=null}}
  if(!detect){status.textContent='Chargement du lecteur…';try{await loadJsQR()}catch(e){status.textContent='❌ Lecteur QR indisponible hors ligne sur ce téléphone. Utilisez le message ou le fichier.';stopScan();return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{const w=video.videoWidth,h=video.videoHeight;if(!w)return null;const s=Math.min(1,720/Math.max(w,h));cv.width=w*s|0;cv.height=h*s|0;cx.drawImage(video,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});return r?r.data:null}}
  if(!scanStream)return;
  status.textContent='🎯 Vise le QR code…';
  let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{const t=await detect();if(t)onText(t)}catch(e){}busy=false},160);
}
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}

/* =========================================================================
   LECTURE D'ÉTIQUETTE (OCR) : photo de la plaque signalétique → puissance (W)
   • Moteur Tesseract.js chargé à la demande (1re fois : connexion nécessaire,
     puis gardé en cache pour marcher hors ligne).
   • Tout se passe sur le téléphone : la photo n'est envoyée nulle part.
   ========================================================================= */
const OCR_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker = null, ocrIdle = null, ocrProgress = null;
function loadOCRLib() { return new Promise((ok, ko) => { if (window.Tesseract) return ok(); const s = document.createElement('script'); s.src = OCR_URL; s.onload = () => window.Tesseract ? ok() : ko(); s.onerror = ko; document.head.appendChild(s); }); }
async function getOCR() {
  clearTimeout(ocrIdle);
  if (ocrWorker) return ocrWorker;
  await loadOCRLib();
  ocrWorker = await Tesseract.createWorker('eng', 1, {logger: m => { if (ocrProgress) ocrProgress(m); }});
  await ocrWorker.setParameters({tessedit_pageseg_mode: '11', preserve_interword_spaces: '1'});
  return ocrWorker;
}
// Libère la mémoire après 2 min sans scan (téléphones modestes)
function ocrSleep() { clearTimeout(ocrIdle); ocrIdle = setTimeout(() => { if (ocrWorker) { ocrWorker.terminate(); ocrWorker = null; } }, 120000); }

// Photo → canvas en niveaux de gris, contraste étiré, tourné de « rot » degrés
async function labelCanvas(file, rot = 0) {
  let img;
  try { img = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch (e) { img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); }); }
  const w0 = img.width, h0 = img.height, s = Math.min(1, 2000 / Math.max(w0, h0)), w = Math.round(w0 * s), h = Math.round(h0 * s);
  const side = rot % 180 !== 0, c = document.createElement('canvas'); c.width = side ? h : w; c.height = side ? w : h;
  const x = c.getContext('2d', {willReadFrequently: true});
  x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data, hist = new Uint32Array(256);
  for (let i = 0; i < p.length; i += 4) { const g = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 | 0; p[i] = g; hist[g]++; }
  const n = p.length / 4; let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += hist[lo]) < n * .02) lo++;
  acc = 0; while (hi > 0 && (acc += hist[hi]) < n * .02) hi--;
  const k = hi > lo ? 255 / (hi - lo) : 1;
  for (let i = 0; i < p.length; i += 4) { const g = Math.max(0, Math.min(255, (p[i] - lo) * k)); p[i] = p[i + 1] = p[i + 2] = g; }
  x.setTransform(1, 0, 0, 1, 0, 0); x.putImageData(d, 0, 0);
  if (img.close) img.close();
  return c;
}

/* Analyse du texte lu → {best: {w, how, a, v, line}, alts, model, volt}
   Priorité : « puissance / input / rated » ; écarte capacité frigorifique (clims),
   dégivrage, lampe, sortie (chargeurs), veille. Sans watts : W = V × A. */
function parseLabel(raw) {
  const fix = s => s.toUpperCase()
    .replace(/(\d)\s*O(?=[\d.,]|\s*[WVAK])/g, '$10').replace(/(^|[^A-Z])O(?=\d)/g, '$10')
    .replace(/(\d)\s*[IL|](?=\d)/g, '$11').replace(/(\d)S(?=\d)/g, '$15').replace(/\/S0\s*HZ/g, '/50HZ')
    .replace(/VV/g, 'W').replace(/(\d)\s*Y(?=[~\s]|$)/gm, '$1V');
  const n = s => parseFloat(String(s).replace(',', '.'));
  const lines = String(raw || '').split(/\r?\n/).map(fix).filter(l => l.trim());
  const GOOD = /PUISSANCE|POWER|INPUT|ENTR[EÉ]E|RATED|NOMINAL|ABSORB|CONSOMM|CONSUMPTION|WATT/;
  const BAD = /CAPACIT|COOLING|REFROIDISS|FRIGORIF|DEFROST|D[EÉ]GIVR|LAMP|AMPOULE|OUTPUT|SORTIE|STANDBY|VEILLE|BTU|KWH/;
  const watts = [], amps = [], volts = [];
  let model = '';
  lines.forEach(l => {
    for (const m of l.matchAll(/(\d{1,5}(?:[.,]\d{1,3})?)\s*(?:[-~\/]\s*(\d{1,5}(?:[.,]\d{1,3})?)\s*)?(KW|W)(?![A-Z])/g)) {
      let w = Math.max(n(m[1]), m[2] ? n(m[2]) : 0);
      if (m[3] === 'KW') w *= 1000;
      if (!(w >= 1 && w <= 12000) || /^\s*H/.test(l.slice(m.index + m[0].length))) continue;
      watts.push({w: Math.round(w), score: (GOOD.test(l) ? 2 : 0) - (BAD.test(l) ? 3 : 0), line: l.trim()});
    }
    for (const m of l.matchAll(/(\d{1,2}(?:[.,]\d{1,2})?)\s*(HP|CV|CH)(?![A-Z])/g)) {
      const w = Math.round(n(m[1]) * 736);
      if (w >= 50 && w <= 12000 && !/BTU|CAPACIT/.test(l)) watts.push({w, score: -1, line: l.trim()});
    }
    for (const m of l.matchAll(/(\d{1,3}(?:[.,]\d{1,2})?)\s*(MA|A)(?![A-Z])/g)) {
      let a = n(m[1]); if (m[2] === 'MA') a /= 1000;
      if (!(a > 0 && a <= 60)) continue;
      if (!(/OUTPUT|SORTIE/.test(l) && !/INPUT|ENTR/.test(l.slice(0, m.index)))) amps.push({a, line: l.trim()});
    }
    for (const m of l.matchAll(/(\d{3})\s*(?:[-~\/]\s*(\d{3})\s*)?V(?![A-Z])/g)) {
      const a = +m[1], b = m[2] ? +m[2] : a;
      if (a >= 100 && b <= 260) volts.push([a, b]);
    }
    if (!model) { const mm = l.match(/MOD[EÈÉ]LE?\s*(?:NO\.?|N[°O]\.?)?\s*[:.]?\s*([A-Z0-9][A-Z0-9\-\/.]{3,24})/); if (mm) model = mm[1].replace(/[.\-\/]+$/, ''); }
  });
  // Réseau sénégalais : 220 V, sauf si l'étiquette indique une autre tension
  let volt = 220;
  if (volts.length && !volts.some(([a, b]) => a <= 220 && b >= 220)) volt = volts[0][0];
  const uniq = [];
  watts.sort((x, y) => y.score - x.score || y.w - x.w).forEach(x => { if (!uniq.some(u => u.w === x.w)) uniq.push(x); });
  let best = null;
  if (uniq.length && uniq[0].score >= 0) best = {w: uniq[0].w, how: 'w', line: uniq[0].line};
  else if (amps.length) best = {w: Math.round(amps[0].a * volt), how: 'a', a: amps[0].a, v: volt, line: amps[0].line};
  else if (uniq.length) best = {w: uniq[0].w, how: 'w', line: uniq[0].line};
  const near = (a, b) => Math.abs(a - b) <= Math.max(a, b) * .05;
  const alts = [];
  const push = w => { if (!(best && near(w, best.w)) && !alts.some(x => near(x, w))) alts.push(w); };
  uniq.filter(x => x.score > -3).forEach(x => push(x.w));
  if (best && best.how === 'w' && amps.length) push(Math.round(amps[0].a * volt));
  return {best, alts: alts.slice(0, 4), model, volt};
}

// Bouton « Scanner l'étiquette » du formulaire appareil
async function scanLabel(file) {
  const f = $('#modal-body form[data-form="app"]'), box = $('#scanRes');
  if (!f || !box || !file) return;
  const btn = $('#scanBtn'); if (btn) btn.disabled = true;
  const status = html => { if (box.isConnected) box.innerHTML = `<div class="scan-status">${html}</div>`; };
  status('⏳ ' + t('Préparation du lecteur…') + `<br><small>${t('La 1re fois, il se télécharge (≈ 5 Mo, connexion nécessaire). Ensuite il marche hors ligne.')}</small>`);
  ocrProgress = m => {
    if (m.status === 'recognizing text') status('🔎 ' + t('Lecture de l\'étiquette… {p} %', {p: Math.round((m.progress || 0) * 100)}));
    else if (/load/.test(m.status || '')) status('⏳ ' + t('Préparation du lecteur…') + (m.progress ? ' ' + Math.round(m.progress * 100) + ' %' : '') + `<br><small>${t('La 1re fois, il se télécharge (≈ 5 Mo, connexion nécessaire). Ensuite il marche hors ligne.')}</small>`);
  };
  let res = null, text = '';
  try {
    const w = await getOCR();
    // Photo prise de travers ? On réessaie en la tournant.
    for (const rot of [0, 90, 270]) {
      const {data} = await w.recognize(await labelCanvas(file, rot));
      const r = parseLabel(data.text);
      if (!text || r.best) text = data.text;
      if (r.best) { res = r; break; }
    }
  } catch (e) {
    ocrProgress = null; ocrSleep(); if (btn) btn.disabled = false;
    if (box.isConnected) box.innerHTML = alertBox('amber', '📶', navigator.onLine === false
      ? t('Connexion nécessaire la première fois pour télécharger le lecteur d\'étiquettes. Réessayez avec internet : ensuite il marchera hors ligne.')
      : t('Le lecteur d\'étiquettes n\'a pas pu démarrer sur ce téléphone. Saisissez la puissance à la main.'));
    return;
  }
  ocrProgress = null; ocrSleep(); if (btn) btn.disabled = false;
  if (!box.isConnected) return;
  const raw = text.trim() ? `<details class="mt-s"><summary class="link-btn" style="cursor:pointer">${t('Voir le texte lu')}</summary><pre class="scan-raw">${esc(text.trim())}</pre></details>` : '';
  if (!res) {
    box.innerHTML = alertBox('amber', '🤔', `<b>${t('Puissance introuvable sur la photo.')}</b><br>${t('Conseils : bonne lumière (pas de flash direct), étiquette nette et bien droite, photo prise de près. Cherchez « W », « kW » ou « A ».')}` + raw);
    return;
  }
  setScanWatts(res.best.w);
  if (res.model && !f.ref.value.trim()) f.ref.value = res.model.slice(0, 40);
  const how = res.best.how === 'a'
    ? t('Calculée : {a} A × {v} V. C\'est un maximum : la consommation réelle est souvent un peu plus basse.', {a: nf(res.best.a, 2), v: res.best.v})
    : t('Lu : « {l} »', {l: esc(res.best.line.slice(0, 60))});
  const alts = res.alts.length ? `<div class="mt-s"><small class="muted">${t('Autres valeurs lues :')}</small><div class="chips mt-s">${res.alts.map(w => `<button type="button" class="chip" data-action="scan-pick" data-id="${w}">${W(w)}</button>`).join('')}</div></div>` : '';
  box.innerHTML = alertBox('green', '✅', `<b>${t('Puissance trouvée : {w}', {w: W(res.best.w)})}</b><br><small>${how}</small>${res.model && f.ref.value === res.model.slice(0, 40) ? `<br><small>${t('Modèle : {m}', {m: esc(res.model)})}</small>` : ''}<br><small>${t('Vérifiez la valeur avant d\'enregistrer.')}</small>${alts}${raw}`);
}
function setScanWatts(w) {
  const f = $('#modal-body form[data-form="app"]'); if (!f) return;
  f.watts.value = w; f.watts.classList.remove('flash'); void f.watts.offsetWidth; f.watts.classList.add('flash');
  appPreview(f);
}

const ICONS = {

  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',
  recharge: '<rect x="3" y="6" width="16" height="12" rx="2"/><path d="M21 10v4"/><path d="m11 8-2.5 4H12l-1 4"/>',

  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'

function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;

  while (box.children.length > 3) box.firstElementChild.remove();

}

/* --- Graphique à barres (SVG) avec info-bulle --- */
function barChart(items, o = {}) {
  const w = 640, h = o.h || 190, padL = 34, padB = 22, padT = 10, n = Math.max(1, items.length);
  const max = Math.max(o.min || 0, ...items.map(i => i.v || 0)) * 1.12 || 1;
  const bw = (w - padL - 4) / n, gap = Math.min(4, bw * .25);
  const y = v => padT + (h - padT - padB) * (1 - v / max);
  const ticks = [0, max / 2, max].map(v => `<line class="gridl" x1="${padL}" x2="${w}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${padL - 5}" y="${y(v) + 3}" text-anchor="end">${nf(v, max < 10 ? 1 : 0)}</text>`).join('');
  const every = Math.ceil(n / (o.labels || 10));
  const bars = items.map((it, i) => {
    const x = padL + i * bw + gap / 2, bh = Math.max(it.v > 0 ? 2 : 0, (h - padT - padB) - (y(it.v || 0) - padT));
    const col = it.flag ? 'var(--red)' : (it.dim ? 'var(--bar2)' : 'var(--bar)');
    const r = Math.min(4, (bw - gap) / 2, bh);
    const path = bh > 0 ? `M${x},${h - padB}V${h - padB - bh + r}q0,-${r} ${r},-${r}H${x + bw - gap - r}q${r},0 ${r},${r}V${h - padB}z` : '';
    return `<g data-tip="${esc(it.tip || '')}"><rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${h - padT - padB}" fill="transparent"/>${path ? `<path d="${path}" fill="${col}"/>` : ''}${it.mark ? `<text x="${x + (bw - gap) / 2}" y="${h - padB - bh - 4}" text-anchor="middle" font-size="11" fill="var(--red)" font-weight="700">!</text>` : ''}${i % every === 0 || i === n - 1 ? `<text class="axis" x="${x + (bw - gap) / 2}" y="${h - 6}" text-anchor="middle">${esc(it.l)}</text>` : ''}</g>`;
  }).join('');
  const ref = o.ref ? `<line x1="${padL}" x2="${w}" y1="${y(o.ref)}" y2="${y(o.ref)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text class="axis" x="${w}" y="${y(o.ref) - 4}" text-anchor="end">${esc(o.refLabel || '')}</text>` : '';
  return `<div class="chart" data-chart><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.title || '')}">${ticks}${bars}${ref}</svg><div class="tip"></div></div>`;
}
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('[data-chart]');
  $$('.chart .tip.show').forEach(tp => { if (!c || !c.contains(tp)) tp.classList.remove('show'); });
  if (!c) return;
  const g = e.target.closest('[data-tip]'), tip = c.querySelector('.tip');
  if (!g || !g.dataset.tip) { tip.classList.remove('show'); return; }
  const r = c.getBoundingClientRect();
  tip.textContent = g.dataset.tip; tip.style.left = clamp(e.clientX - r.left, 60, r.width - 60) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.classList.add('show');
});

/* --- Jauge des tranches du mois --- */
function trancheGauge(P, cum, extra = 0) {
  const lastTo = P.tranches.filter(x => x.to != null).map(x => x.to).pop() || 150;
  const max = Math.max(lastTo * 1.2, (cum + extra) * 1.1, 10);
  let lo = 0;
  const parts = P.tranches.map((tr, i) => { const hi = tr.to == null ? max : Math.min(tr.to, max); const w = Math.max(0, hi - lo) / max * 100; const out = `<i style="width:${w}%;background:${TR_COLORS[i % TR_COLORS.length]};opacity:.22"></i>`; lo = hi; return out; }).join('');
  const pos = clamp(cum / max * 100, 0, 100), pos2 = clamp((cum + extra) / max * 100, 0, 100);
  const marks = P.tranches.filter(x => x.to != null && x.to < max).map(x => `<span style="position:absolute;left:${x.to / max * 100}%;transform:translateX(-50%)">${nf(x.to)}</span>`).join('');
  return `<div class="gauge-wrap"><div class="gauge" style="position:relative">${parts}
      <i style="position:absolute;left:0;top:0;width:${pos}%;background:var(--primary);border-radius:99px"></i>
      ${extra > 0 ? `<i style="position:absolute;left:${pos}%;top:0;width:${pos2 - pos}%;background:var(--primary);opacity:.45"></i>` : ''}</div>
    <div style="position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:4px"><span style="position:absolute;left:0">0</span>${marks}<span style="position:absolute;right:0">kWh</span></div>
    <div class="tr-legend">${P.tranches.map((tr, i) => `<span><i style="background:${TR_COLORS[i % TR_COLORS.length]}"></i>${trancheLabel(P, i)} · ${nf(tr.p, 2)} F</span>`).join('')}</div></div>`;
}

/* --- Rappels & conseils contextuels (écran d'accueil) --- */
function reminders(S) {
  const out = [], P = S.P, add = (key, cls, ic, html) => { if (D.settings.dismissed[key] !== today()) out.push({key, cls, ic, html}); };
  const t1 = P.tranches[0], p2 = P.tranches[1] ? P.tranches[1].p : t1.p;
  if (S.daysLeft != null && S.daysLeft <= 3) add('low', 'red', '🔋', t('<b>Crédit bientôt épuisé</b> : il vous reste environ {d} jour(s) ({k}). Prévoyez votre recharge.', {d: nf(Math.max(0, S.daysLeft), 1), k: K(S.solde)}));
  else if (S.daysLeft != null && S.daysLeft <= 6) add('low2', 'amber', '🔋', t('Il vous reste environ <b>{d} jours</b> de crédit ({k}), épuisement vers le {date}.', {d: nf(S.daysLeft, 0), k: K(S.solde), date: new Date(Date.now() + S.daysLeft * DAY).toLocaleDateString(LOCALE(), {day: 'numeric', month: 'long'})}));
  // Meilleur moment pour recharger
  if (S.daysLeft != null && S.room.i > 0 && S.daysToEnd <= 5 && S.daysLeft < S.daysToEnd + 1) add('wait1', 'violet', '📅', t('<b>Astuce tranches</b> : le compteur des tranches revient à zéro dans {n} jour(s). Rechargez juste le nécessaire d\'ici là, puis faites votre grosse recharge le 1er : vos premiers {k} kWh repasseront à {p} F au lieu de {p2} F.', {n: S.daysToEnd, k: nf(t1.to), p: nf(t1.p, 2), p2: nf(priceAt(P, S.bought), 2)}));
  if (S.room.i === 0 && S.room.kwh <= 35 && S.room.kwh > 0) add('near', 'amber', '📶', t('Vous approchez de la fin de la <b>1re tranche</b> : encore {k} au tarif bas (≈ {f}). Au-delà, le kWh passe à {p} F.', {k: K(S.room.kwh), f: F(S.room.money), p: nf(priceAt(P, t1.to + 1), 2)}));
  else if (S.room.i > 0) add('over', 'blue', 'ℹ️', t('Ce mois-ci vous avez déjà acheté {k} : vous êtes en <b>tranche {n}</b>, chaque kWh vous coûte maintenant {p} F (taxes comprises).', {k: K(S.bought), n: S.room.i + 1, p: nf(S.price, 2)}));
  if (S.dom <= 3) add('newmonth', 'green', '🗓️', t('<b>Nouveau mois</b> : le compteur des tranches est remis à zéro. Tes {k} premiers kWh achetés ce mois sont au tarif le plus bas.', {k: nf(t1.to)}));
  if (S.lastReadAge != null && S.lastReadAge >= 4) add('read', 'amber', '✍️', t('Votre dernier relevé date de <b>{n} jours</b>. Notez le solde de votre compteur (10 secondes) pour garder des chiffres justes.', {n: Math.floor(S.lastReadAge)}));
  const yd = dstr(new Date(Date.now() - DAY)), yv = S.C.daily[yd], yc = S.C.cover[yd] || 0;
  if (yv != null && yc > .6 && S.C.median > 0 && yv > Math.max(S.C.median * 1.45, S.C.median + 1.2)) add('yday', 'amber', '📈', t('Hier vous avez consommé <b>{k}</b> ({f}), soit {x} % de plus que d\'habitude. Un appareil est resté allumé ?', {k: K(yv), f: F(yv * S.price), x: nf((yv / S.C.median - 1) * 100)}));
  if (S.C.avgReal && S.est > 0) {
    const ratio = S.C.avgReal.avg / S.est;
    if (ratio > 1.35) add('gap', 'red', '🕵️', t('Votre compteur indique <b>{r}/jour</b> mais vos appareils n\'en expliquent que {e}/jour. Un appareil oublié, mal réglé ou défaillant ? Lancez le <b>mode détective</b>.', {r: K(S.C.avgReal.avg), e: K(S.est)}));
    else if (ratio < .65) add('gap2', 'blue', '🔎', t('Vos appareils devraient consommer {e}/jour mais le compteur n\'indique que {r}/jour : vos heures d\'utilisation sont sans doute surestimées.', {r: K(S.C.avgReal.avg), e: K(S.est)}));
  }
  if (S.m.budget > 0) {
    if (S.spent > S.m.budget) add('bud', 'red', '💸', t('Budget du mois dépassé : {s} dépensés pour un budget de {b}.', {s: F(S.spent), b: F(S.m.budget)}));
    else if (S.avg > 0 && S.projMonthCost > S.m.budget * 1.05) add('bud2', 'amber', '💸', t('À ce rythme, ce mois vous coûtera environ <b>{p}</b> pour un budget de {b}.', {p: F(S.projMonthCost), b: F(S.m.budget)}));
  }
  const apps = appsOf(), tot = sum(apps, appKwhDay);
  if (tot > 0) {
    const top = [...apps].sort((a, b) => appKwhDay(b) - appKwhDay(a))[0], share = appKwhDay(top) / tot;
    if (share >= .4 && /^clim/.test(top.type)) add('clim', 'violet', '❄️', t('Votre clim représente <b>{p} %</b> de votre consommation estimée. Chaque degré en plus fait économiser environ 6 % : à 26 °C au lieu de 20 °C, vous gagneriez près de <b>{f}/mois</b>.', {p: nf(share * 100), f: F(appKwhDay(top) * .33 * 30 * S.price)}));
    else if (share >= .4) add('top', 'violet', '🔌', t('<b>{n}</b> représente {p} % de votre consommation estimée ({f}/mois). C\'est l\'appareil à surveiller en priorité.', {n: esc(appName(top)), p: nf(share * 100), f: F(appKwhDay(top) * 30 * S.price)}));
    const sb = sum(apps, appStandbyDay);
    if (sb >= .25) add('sb', 'blue', '🌙', t('Vos appareils en veille consomment environ {k} par mois ({f}) sans rien faire. Voir la <b>chasse à la veille</b>.', {k: K(sb * 30), f: F(sb * 30 * S.price)}));
  }
  const hasData = D.recharges.length + D.readings.length + D.appliances.length > 0;
  if (hasData && Date.now() - (D.settings.lastBackup || 0) > 7 * DAY) add('backup', 'amber', '💾', t('Pensez à <b>sauvegarder vos données</b> (Réglages → Exporter). Sans sauvegarde, vider le navigateur efface tout.') + ` <button class="btn btn-sm btn-primary mt-s" data-action="export">💾 ${t('Exporter mes données')}</button>`);
  return out;
}

function concrete(price) {
  const mine = k => appsOf().find(a => a.type === k);
  const one = (k, hours) => { const a = mine(k); const r = refOf(k); const w = a ? num(a.watts) : r.w, duty = a && a.duty !== '' && a.duty != null ? num(a.duty) : r.duty; return w * hours * duty / 1000; };
  const climK = mine('clim_inv') ? 'clim_inv' : 'clim';
  return [
    {e: '❄️', l: t('Une nuit de clim (8 h)'), k: one(climK, 8)},
    {e: '🧊', l: t('Un mois de frigo'), k: (mine('frigo_old') ? one('frigo_old', 24) : one('frigo', 24)) * 30},

    {e: '👔', l: t('Un repassage (30 min)'), k: one('fer', .5)},
    {e: '📺', l: t('Une soirée de télé (4 h)'), k: one('tv', 4) + one('deco', 4)},
    {e: '💡', l: t('5 ampoules LED toute une soirée (5 h)'), k: 5 * one('led', 5)},
    {e: '🔌', l: t('Recharger un téléphone'), k: .012}
  ];
}
function topApps(n) {
  const apps = appsOf(), tot = sum(apps, appKwhDay), p = curPrice();

}

/* --- Recharges & relevés --- */
views.recharges = () => {

  const ev = [...R.map(r => ({...r, kind: 'rech'})), ...RD.map(r => ({...r, kind: 'read'}))].sort((a, b) => parseDT(b.date) - parseDT(a.date));

  let h = topbar() + pageHead(t('Historique'), t('Recharges & relevés'), `<button class="btn btn-primary" data-action="add-recharge">⚡ ${t('Nouvelle recharge')}</button><button class="btn" data-action="add-reading">✍️ ${t('Noter mon solde')}</button>`);
  h += alertBox('blue', '💡', t('<b>La règle d\'or</b> : à chaque recharge, regardez votre compteur <b>avant</b> de taper le code et notez le solde restant. Entre deux recharges, notez votre solde tous les 1 à 3 jours (le matin, par exemple). C\'est ce qui permet de calculer votre vraie consommation.'));

  if (!ev.length) return h + `<div class="card mt">${empty(t('Aucune recharge ni relevé. Commencez par noter le solde actuel de votre compteur.'))}</div>`;
  const byM = {};
  ev.forEach(e => (byM[ymOf(e.date)] = byM[ymOf(e.date)] || []).push(e));
  Object.keys(byM).sort().reverse().forEach(ym => {
    const list = byM[ym], kwh = sum(list.filter(x => x.kind === 'rech'), x => num(x.kwh)) + num(D.offsets[meter().id + '|' + ym]), mon = sum(list.filter(x => x.kind === 'rech'), x => num(x.amount));
    h += `<div class="section"><div class="section-title"><span>${monthName(ym)}</span><span>${K(kwh, 1)} · ${F(mon)}</span></div><div class="card"><div class="list">${list.map(e => {
      if (e.kind === 'read') return `<div class="li"><div class="li-ic">✍️</div><div class="g"><b>${t('Relevé')} : ${K(num(e.solde))}</b><small>${fmtDT(e.date)}${e.note ? ' · ' + esc(e.note) : ''}</small></div><button class="icon-btn" data-action="edit-reading" data-id="${e.id}" aria-label="${esc(t('Modifier'))}">${icon('edit', 17)}</button></div>`;
      const v = verifyRecharge(e), ok = v.diffPct == null ? '' : Math.abs(v.diffPct) <= 3 ? `<span class="badge b-green">✓ ${t('conforme')}</span>` : v.diffPct < 0 ? `<span class="badge b-red">${nf(v.diffPct, 1)} %</span>` : `<span class="badge b-blue">+${nf(v.diffPct, 1)} %</span>`;
      return `<div class="li"><div class="li-ic">⚡</div><div class="g"><b>${F(num(e.amount))} → ${K(num(e.kwh), 1)} ${ok}</b><small>${fmtDT(e.date)} · ${num(e.kwh) > 0 ? nf(num(e.amount) / num(e.kwh), 1) + ' F/kWh' : ''}${e.before !== '' && e.before != null ? ' · ' + t('solde avant {k}', {k: K(num(e.before))}) : ' · <span class="warn">' + t('solde avant non noté') + '</span>'}</small></div><button class="icon-btn" data-action="edit-recharge" data-id="${e.id}" aria-label="${esc(t('Modifier'))}">${icon('edit', 17)}</button></div>`;
    }).join('')}</div></div></div>`;
  });
  return h;
};
// Compare une recharge à la grille (avec le cumul acheté avant elle dans le mois)
function verifyRecharge(r, P = profOf(D.meters.find(m => m.id === r.meterId))) {
  const ts = parseDT(r.date), ym = ymOf(r.date);
  const cum = boughtIn(ym, r.meterId, ts, r.id), first = isFirstOfMonth(ym, r.meterId, ts, r.id);
  const exp = kwhFor(P, cum, num(r.amount), first);
  const diffPct = num(r.kwh) > 0 && exp.kwh > 0 ? (num(r.kwh) / exp.kwh - 1) * 100 : null;
  return {cum, first, exp, diffPct};
}

function breakdownHtml(b, P) {
  const rows = [];
  b.parts.forEach(pt => rows.push(`<div class="kv"><span>${t('Énergie')} ${trancheLabel(P, pt.ti)} · ${K(pt.kwh, 2)} × ${nf(pt.p, 2)} F</span><b>${F(pt.ht)}</b></div>`));
  if (b.tco > .5) rows.push(`<div class="kv"><span>${t('Taxe communale')} (${nf(P.tco, 1)} %)</span><b>${F(b.tco)}</b></div>`);
  if (b.tva > .5) rows.push(`<div class="kv"><span>${t('TVA')} (${nf(P.tva)} %)</span><b>${F(b.tva)}</b></div>`);
  if (b.redev > .5) rows.push(`<div class="kv"><span>${t('Redevance (1re recharge du mois)')}</span><b>${F(b.redev)}</b></div>`);
  if (b.timbre > .5) rows.push(`<div class="kv"><span>${t('Timbre')}</span><b>${F(b.timbre)}</b></div>`);
  const total = b.ht + b.tco + b.tva + b.redev + b.timbre;
  rows.push(`<div class="kv total"><span>${t('Total')}</span><b>${F(total)}</b></div>`);
  const segs = [[b.ht, 'var(--bar)', t('Énergie')], [b.tco, '#0ea5e9', t('Taxe communale')], [b.tva, '#7c3aed', t('TVA')], [b.redev + b.timbre, '#64748b', t('Frais fixes')]].filter(x => x[0] > .5);
  const bar = total > 0 ? `<div class="gauge mt" style="height:16px">${segs.map(s => `<i style="width:${s[0] / total * 100}%;background:${s[1]}" title="${esc(s[2])}"></i>`).join('')}</div><div class="tr-legend">${segs.map(s => `<span><i style="background:${s[1]}"></i>${s[2]} ${nf(s[0] / total * 100)} %</span>`).join('')}</div>` : '';
  return `<div class="list">${rows.join('')}</div>${bar}`;
}

};

views.stats = () => {

  const days = [...Array(30)].map((_, i) => dstr(new Date(Date.now() - (29 - i) * DAY)));
  h += `<div class="card"><div class="card-head"><div><h2>📅 ${t('Consommation par jour (30 jours)')}</h2><p class="hint mt-s">${C.median > 0 ? t('Habituel : {k}/jour', {k: kfTxt(C.median, S.price)}) : ''}</p></div></div>${days.some(d => C.daily[d] > 0) ? barChart(days.map(d => { const v = C.daily[d] || 0, cov = C.cover[d] || 0, flag = C.median > 0 && cov > .6 && v > Math.max(C.median * 1.45, C.median + 1.2); return {l: d.slice(8), v, flag, mark: flag, dim: cov < .6, tip: `${fmtDate(d)} : ${kfTxt(v, S.price)}${cov < .6 ? ' (' + t('incomplet') + ')' : ''}`}; }), {h: 200, ref: C.median, refLabel: t('habituel'), labels: 10, title: t('Consommation par jour')}) : empty(t('Pas encore assez de relevés.'))}</div>`;
  if (C.anomalies.length) h += `<div class="card mt"><h2>🚨 ${t('Périodes anormales')}</h2><div class="list mt">${C.anomalies.slice(-8).reverse().map(x => `<div class="li"><div class="li-ic">⚠️</div><div class="g"><b>${fmtDT(dtstr(new Date(x.t1)))} → ${fmtDT(dtstr(new Date(x.t2)))}</b><small>${t('{r}/jour au lieu de {m} (+{p} %)', {r: K(x.rate), m: K(C.median), p: nf((x.rate / C.median - 1) * 100)})}</small></div><b>${K(x.kwh, 1)}</b></div>`).join('')}</div><p class="hint mt">${t('Que s\'est-il passé ces jours-là ? Invités, chaleur, clim plus longtemps, appareil oublié ?')}</p></div>`;
  // Mois
  const months = [...Array(12)].map((_, i) => shiftYM(curYM(), i - 11));
  const mdata = months.map(ym => ({ym, k: boughtIn(ym), f: spentIn(ym), c: sum(Object.entries(C.daily).filter(([d]) => d.startsWith(ym)), ([, v]) => v)}));
  h += `<div class="card mt"><h2>🗓️ ${t('kWh achetés par mois')}</h2>${mdata.some(x => x.k > 0) ? barChart(mdata.map(x => ({l: monthShort(x.ym), v: x.k, tip: `${monthName(x.ym)} : ${K(x.k, 0)} · ${F(x.f)}`})), {h: 190, labels: 12, title: t('kWh achetés par mois'), ref: P.tranches[0].to, refLabel: 'T1'}) : empty(t('Aucune recharge enregistrée.'))}
    <div class="table-wrap mt"><table class="t"><thead><tr><th>${t('Mois')}</th><th>${t('Acheté')}</th><th>${t('Dépensé')}</th><th>${t('Prix moyen')}</th><th>${t('Consommé')}</th></tr></thead><tbody>${mdata.slice().reverse().filter(x => x.k || x.c).map(x => `<tr><td>${monthName(x.ym)}</td><td>${K(x.k, 0)}</td><td>${F(x.f)}</td><td>${x.k ? nf(x.f / x.k, 1) + ' F' : '—'}</td><td>${x.c ? K(x.c, 0) : '—'}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">—</td></tr>`}</tbody></table></div></div>`;
  // Comparaisons
  const cm = mdata[11], pm = mdata[10], ly = {ym: shiftYM(curYM(), -12), k: boughtIn(shiftYM(curYM(), -12)), f: spentIn(shiftYM(curYM(), -12))};
  const cmp = (a, b) => b > 0 ? (a / b - 1) * 100 : null;
  const dPrev = cmp(cm.k / Math.max(1, S.dom) * S.dim, pm.k), dLy = cmp(cm.k / Math.max(1, S.dom) * S.dim, ly.k);
  h += `<div class="grid g2 mt"><div class="card"><h2>↔️ ${t('Comparaisons')}</h2><div class="list mt">
    <div class="kv"><span>${t('Ce mois (projeté) vs {m}', {m: monthName(pm.ym)})}</span><b class="${dPrev > 10 ? 'neg' : dPrev < -10 ? 'pos' : ''}">${dPrev == null ? '—' : (dPrev > 0 ? '+' : '') + nf(dPrev) + ' %'}</b></div>
    <div class="kv"><span>${t('Ce mois (projeté) vs {m}', {m: monthName(ly.ym)})}</span><b class="${dLy > 10 ? 'neg' : dLy < -10 ? 'pos' : ''}">${dLy == null ? '—' : (dLy > 0 ? '+' : '') + nf(dLy) + ' %'}</b></div></div>
    <p class="hint mt">${t('Saison chaude (avril à octobre) : clim et ventilateurs tournent plus longtemps, la consommation peut doubler. C\'est souvent l\'explication du passage de 6 à 15 kWh par jour.')}</p></div>
    <div class="card"><h2>⚖️ ${t('Estimé (appareils) vs réel (compteur)')}</h2><div class="list mt"><div class="kv"><span>${t('Estimé')}</span><b>${kf(S.est, S.price)} ${t('/jour')}</b></div><div class="kv"><span>${t('Réel')}</span><b>${C.avgReal ? kf(C.avgReal.avg, S.price) + ' ' + t('/jour') : '—'}</b></div></div>
    <div class="mt">${!C.avgReal ? alertBox('blue', 'ℹ️', t('Notez votre solde quelques jours de suite pour connaître votre vraie consommation.')) : S.est <= 0 ? alertBox('blue', 'ℹ️', t('Ajoutez vos appareils pour comparer.')) : (() => { const g = C.avgReal.avg / S.est; return g > 1.35 ? alertBox('red', '🕵️', t('Le compteur consomme {p} % de plus que vos appareils. Pistes : appareil oublié dans l\'inventaire, heures sous-estimées, frigo ou clim défaillant(e), fuite électrique, ou compteur à faire vérifier par la Senelec. Lancez le mode détective.', {p: nf((g - 1) * 100)})) : g < .65 ? alertBox('amber', '🔎', t('Vos appareils devraient consommer plus que ce que mesure le compteur : réduisez les heures/jour dans l\'inventaire.')) : alertBox('green', '✅', t('Votre inventaire explique bien votre consommation réelle.')); })()}</div></div></div>`;
  h += `<div class="flex wrap mt"><button class="btn btn-sm" data-action="csv">⬇️ ${t('Exporter en CSV (Excel)')}</button><button class="btn btn-sm" data-action="print">🖨️ ${t('Imprimer')}</button></div>`;
  return h;
};

window.rechPreview = function (f) {

  const cum = boughtIn(ym, meter().id, ts, id), first = isFirstOfMonth(ym, meter().id, ts, id), exp = kwhFor(P, cum, a, first), k = num(f.kwh.value);
  let html = '';

  $('#rechPrev').innerHTML = html;
};

const forms = {
  async activate(f) {
    const c = sigOf(f.code);
    if (!c) return renderLock(t("Collez votre code d'activation."));
    if (!(window.crypto && crypto.subtle)) return renderLock(t("Ouvrez l'application depuis son lien https pour l'activer."));
    if (await checkSig(c)) { storeSig(c); unlockApp(); }
    else renderLock(t('Code incorrect. Copiez-le en entier : il doit correspondre à ce code appareil.'));
  },
  noop() {},
  recharge(f) {
    const amount = money(f.amount); if (amount <= 0) return toast(t('Montant invalide.'), 'err');
    const unknown = f.unknown === 'on', before = unknown || f.before === '' ? '' : num(f.before);
    if (!unknown && f.before === '') return toast(t('Notez le solde AVANT recharge, ou cochez « Je n\'ai pas noté le solde avant ».'), 'warn');
    const ts = parseDT(f.date), ym = ymOf(f.date);
    let kwh = num(f.kwh);
    if (!kwh) kwh = r2(kwhFor(profOf(), boughtIn(ym, meter().id, ts, f.id), amount, isFirstOfMonth(ym, meter().id, ts, f.id)).kwh);
    const data = {amount, kwh, before, date: f.date, note: (f.note || '').trim(), meterId: meter().id};
    if (f.id) Object.assign(D.recharges.find(r => r.id === f.id) || (D.recharges.push({id: f.id}), D.recharges[D.recharges.length - 1]), data); else D.recharges.push({id: uid(), ...data});
    save(); closeModal(); render();
    const v = verifyRecharge(f.id ? D.recharges.find(r => r.id === f.id) : D.recharges[D.recharges.length - 1]);
    toast(v.diffPct != null && v.diffPct < -3 ? t('Recharge enregistrée. ⚠️ {p} % de kWh en moins que la grille.', {p: nf(-v.diffPct, 1)}) : t('Recharge enregistrée ✓'), v.diffPct != null && v.diffPct < -3 ? 'warn' : '');
  },

    if (f.id) Object.assign(D.readings.find(r => r.id === f.id) || (D.readings.push({id: f.id}), D.readings[D.readings.length - 1]), data); else D.readings.push({id: uid(), ...data});
    save(); closeModal(); render();
    const C = consumption(), lastIv = C.iv[C.iv.length - 1];
    toast(lastIv && lastIv.t2 === parseDT(f.date) ? t('Relevé enregistré : {k} consommés depuis le dernier point ({f}).', {k: K(lastIv.kwh), f: F(lastIv.kwh * curPrice())}) : t('Relevé enregistré ✓'));
  },

    save(); closeModal(); render(); toast(t('Appareil enregistré ✓'));
  },
  meter(f) {
    const data = {name: f.name.trim(), profile: f.profile, number: (f.number || '').trim(), budget: money(f.budget)};
    if (f.id) Object.assign(D.meters.find(m => m.id === f.id) || (D.meters.push({id: f.id, people: [], created: today()}), D.meters[D.meters.length - 1]), data);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.tagName === 'SELECT' || el.type === 'checkbox') return;
  const fn = actions[el.dataset.action]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.id, el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.action && changes[el.dataset.action]) return changes[el.dataset.action](el.dataset.id, el);
  if (el.dataset && el.dataset.live && (el.type === 'file' || el.type === 'month')) live[el.dataset.live](el);

document.addEventListener('input', e => {

  if (el.dataset && el.dataset.sim) { const o = state.achat[el.dataset.sim]; o[el.dataset.f] = el.value; if (el.dataset.f === 'type') { const r = refOf(el.value); o.watts = r.w; o.hours = r.h; render(); return; } simLive(); return; }

});
document.addEventListener('submit', e => {

fr: [
['🚀 Démarrer en 5 minutes', `<ol>
<li><b>Choisissez votre compteur</b> : en haut de l'écran (📍), donnez un nom à votre lieu (Maison, Boutique…). Par défaut le tarif est « Domestique petite puissance », celui de la plupart des foyers.</li>
<li><b>Ajoutez vos appareils</b> : onglet <b>Appareils</b>. Le plus rapide : « 📝 Décrire en texte » et écrivez par exemple <code>2 télés Samsung 43 pouces 5h, 1 clim LG 1,5 CV inverter 8h, 3 ventilateurs, 1 vieux frigo, 6 ampoules LED</code>.</li>
<li><b>Notez votre solde</b> : regardez l'écran de votre compteur et touchez « ✍️ Noter mon solde ».</li>

['📶 Comment marchent les tranches Woyofal ?', `<p>Le prix du kWh dépend de <b>combien de kWh vous avez ACHETÉS depuis le 1er du mois</b>. Le compteur des tranches repart à zéro chaque 1er du mois.</p>
