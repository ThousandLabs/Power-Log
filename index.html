<li>Si vous ne la connaissez pas, la <b>table de référence</b> propose une valeur typique. Pour les clims (CV), télés (pouces) et frigos (litres), la taille ajuste automatiquement la puissance.</li>
<li><b>Heures par jour</b> : soyez honnête, c'est le chiffre qui change le plus le résultat.</li>
<li><b>Réglages avancés</b> : le « temps de marche réel » sert pour les appareils qui s'arrêtent tout seuls (frigo ≈ 40 %, clim classique ≈ 80 %, clim inverter ≈ 45 %). La « veille » est ce que l'appareil consomme éteint mais branché.</li>
<li>Le <b>mode détective</b> permet de remplacer la valeur estimée par une mesure réelle.</li></ul>`],
['📷 Scanner l\'étiquette d\'un appareil', `<p>Dans le formulaire d'un appareil, touchez <b>📷 Scanner l'étiquette</b> et prenez en photo la plaque signalétique (souvent derrière ou dessous). L'appli lit la puissance et remplit le champ « Puissance (W) ».</p>
<ul><li>Elle cherche « W » ou « kW » (ex. <code>1500W</code>, <code>2,2kW</code>). Pour une clim, elle prend la <b>puissance absorbée</b> et ignore la capacité frigorifique.</li>
<li>S'il n'y a que des ampères, elle calcule <b>W = 220 V × A</b> : c'est un maximum, la vraie consommation est souvent un peu plus basse.</li>
<li>Pour une bonne lecture : bonne lumière, pas de flash direct, photo nette, de près et bien droite.</li>
<li>La 1re fois, le lecteur se télécharge (≈ 5 Mo, internet nécessaire), puis il marche hors ligne. La photo reste sur votre téléphone.</li>
<li>Vérifiez toujours la valeur avant d'enregistrer, et corrigez-la si besoin.</li></ul>`],
['📝 Décrire ses appareils en texte', `<p>Dans « Mes appareils », touchez <b>📝 Décrire en texte</b> et écrivez naturellement, en français, en anglais ou avec des mots wolof courants :</p>
<p><code>2 télés Samsung 43 pouces 5h, 1 clim LG 1,5 CV inverter 8h, 3 ventilateurs 10h, 1 vieux frigo 300 litres, 6 ampoules LED, 1 décodeur Canal+, 1 fer à repasser</code></p>
<p>L'appli reconnaît la quantité, le type, la marque, la référence (ex : <code>UA43T5300</code>), la taille, la puissance (« 1200 W ») et les heures (« 5h »). Vous vérifiez la liste, ajustes les heures puis touches « Ajouter ».</p>
<p><b>Format précis</b> (une ligne par appareil) : <code>Quantité | Type | Marque | Référence | W | heures/jour</code>, par exemple <code>1 | Climatiseur inverter | Gree | GWH12 | 1100 | 8</code>. Le bouton « 🤖 Encore plus précis avec une IA » copie un message tout prêt : donnez-le à Claude ou Gemini avec vos références exactes, puis collez la réponse.</p>`],
['🧮 Calculateur et vérificateur de ticket', `<p><b>Calculateur</b> : tapez un montant (ex : 10 000 F) et vois combien de kWh vous recevrez maintenant, et combien vous recevriez le 1er du mois. Vous pouvez aussi faire l'inverse : « je veux 100 kWh, combien payer ? ». Il vous dit aussi le montant maximum pour rester dans la tranche en cours.</p>
<p><b>Vérificateur</b> : recopiez le montant payé et les kWh reçus de votre ticket (SMS). L'appli compare à la grille officielle, vous explique où est parti l'argent (énergie, taxe communale, TVA, redevance) et signale un écart. Si votre ticket détaille les taxes, vous pouvez <b>étalonner</b> votre grille en un clic.</p>
<div class="alert alert-blue"><span class="a-ic">ℹ️</span><span>Un petit écart (± 3 %) est normal (arrondis). Un gros écart vient souvent des kWh déjà achetés dans le mois mal renseignés, ou d'une redevance non prise en compte.</span></div>`],
['🕵️ Mode détective : trouver l\'appareil qui consomme trop', `<ol><li><b>Repérez le voyant</b> de votre compteur (petite lumière rouge marquée « imp/kWh »). Notez le chiffre (souvent 1000 ou 1600) dans Réglages → Compteur.</li>
<li><b>Éteignez tout</b> et touchez « Mesurer la base ». Tapez le gros bouton à chaque clignotement pendant 30 secondes. La base doit être presque nulle (moins de 15 W). Sinon : appareil oublié, fuite ou câblage à vérifier par un électricien.</li>
<li><b>Allumez un seul appareil</b>, choisissez-le dans la liste et mesurez. L'appli donne sa puissance réelle et la compare à ce que vous avez déclaré.</li>
<li>Si la mesure est bien plus forte que prévu, l'appareil est suspect. Touchez « Appliquer » pour corriger l'inventaire.</li></ol>
<p>Autre méthode sans voyant : notez le solde (avec les décimales), attendez 20 minutes sans rien changer, notez-le à nouveau.</p>`],
['🌙 Chasse à la veille', `<p>Beaucoup d'appareils consomment même éteints : décodeur (le champion), télé, console, sono, micro-ondes… L'écran <b>Chasse à la veille</b> calculez combien ça vous coûte par mois et par an. Cochez les appareils que vous pouvez débrancher pour voir l'économie.</p>
<p>Astuce : une multiprise à interrupteur coupe télé + décodeur + sono d'un seul geste.</p>`],
['🛒 Simulateur d\'achat', `<p>Avant d'acheter une clim, un frigo ou une télé, comparez deux modèles : puissance, heures d'utilisation et prix d'achat. L'appli calcule le coût mensuel (en tenant compte des tranches et de votre consommation actuelle) et en combien de mois le modèle plus économe est remboursé. Exemple typique : une clim inverter plus chère à l'achat est souvent remboursée en moins de 2 ans.</p>`],
['👥 Plusieurs compteurs et partage de facture', `<ul><li>Touchez 📍 en haut pour ajouter ou changer de compteur (maison, boutique, chambre louée…). Chaque compteur a ses appareils, recharges, relevés, budget et type de tarif.</li>
<li><b>Partage de facture</b> : ajoutez les personnes (colocataires, famille), attribuez chaque appareil à son propriétaire (ou « Commun »). L'appli répartit le montant du mois selon la consommation estimée de chacun et prépare un message WhatsApp.</li></ul>`],
['🔔 Les rappels sur l\'écran d\'accueil', `<p>Pas de notifications : les rappels s'affichent à l'ouverture de l'appli. Par exemple :</p>
<ul><li>« Il vous reste environ 3 jours de crédit »</li><li>« Vous approchez de la fin de la 1re tranche »</li><li>« Le compteur des tranches revient à zéro dans 2 jours : attendez pour la grosse recharge »</li><li>« Hier vous avez consommé 40 % de plus que d'habitude »</li><li>« Votre dernier relevé date de 5 jours »</li><li>« Budget du mois bientôt dépassé », « Pensez à sauvegarder »…</li></ul>
<p>Touche ✕ pour masquer un rappel jusqu'au lendemain.</p>`],
['💰 Modifier la grille tarifaire', `<p>Les tarifs par défaut sont les tarifs officiels Senelec (grilles CRSE au 1er janvier 2026). Si la Senelec change ses prix, allez dans <b>Réglages → Grille tarifaire</b> : vous pouvez changer chaque tranche (borne et prix), la TVA, le seuil de TVA, la taxe communale, la redevance et le timbre, ajouter ou supprimer une tranche, ou créer une grille personnalisée. Le bouton « Revenir aux tarifs officiels » annule vos changements.</p>`],
['💾 Sauvegarde, changement de téléphone', `<ul><li>Toutes vos données restent <b>sur votre téléphone</b>, rien n'est envoyé sur Internet.</li>
<li>Réglages → <b>Exporter mes données</b> créez un fichier. Envoyez-le-vous (WhatsApp, e-mail) au moins une fois par mois.</li>
<li>Nouveau téléphone : installez l'appli, demandez un nouveau code d'activation (le code est lié à l'appareil), puis <b>Importer</b> votre fichier.</li>
<li>Vider les données du navigateur efface tout : gardez toujours une sauvegarde récente.</li></ul>`],
['📲 Installer l\'application', installHelp],
['🔑 Activation et code d\'accès', `<p>Chaque téléphone a son <b>code appareil</b> (ex : PL-7KQ2-M9XA), visible sur l'écran d'activation et dans les Réglages. Envoie-le sur WhatsApp au ${CONTACT_FMT} pour recevoir votre code d'activation, à coller une seule fois. Vous pouvez aussi scanner le QR code du vendeur. Le code ne fonctionne que sur votre téléphone.</p><p><b>Essai gratuit :</b> sur l'écran d'activation, touchez « Commencer l'essai gratuit » pour utiliser {app} pendant 24 h sans code (une seule fois par téléphone). À la fin, l'appli demande un code d'activation ; vos données sont conservées.</p>`.replace('{app}', APP)],
['❓ Questions fréquentes', `<ul><li><b>Les chiffres sont-ils officiels ?</b> La grille par défaut est celle publiée par la CRSE. Les consommations d'appareils sont des estimations ; vos relevés donnent la vérité.</li>
<li><b>Faut-il Internet ?</b> Non. Une fois installée, l'appli fonctionne hors ligne.</li>
<li><b>Mon solde a augmenté sans recharge ?</b> Une recharge a été oubliée ou un chiffre mal saisi : vérifiez l'historique.</li>
<li><b>Plusieurs petites recharges, c'est moins cher ?</b> Non : c'est le total acheté dans le mois qui décide du prix. Par contre, le moment (avant ou après le 1er) compte beaucoup.</li></ul>`]
],
en: [
['🚀 Get started in 5 minutes', `<ol><li><b>Pick your meter</b> at the top (📍) and name your place (Home, Shop…). The default tariff is "Domestic low power", used by most homes.</li>
<li><b>Add your appliances</b> in <b>Appliances</b>. Fastest: "📝 Describe in text", e.g. <code>2 Samsung TVs 43 inches 5h, 1 LG 1.5 HP inverter AC 8h, 3 fans, 1 old fridge, 6 LED bulbs</code>.</li>
<li><b>Record your balance</b>: read the meter screen and tap "✍️ Record my balance".</li>
<li><b>Every top-up</b>: before typing the token, note the remaining balance; then save the amount and kWh received.</li>
<li><b>Every 1 to 3 days</b>, record your balance. The app computes your real consumption, days left, and warns you about problems.</li></ol>`],
['📶 How do Woyofal tiers work?', `<p>The kWh price depends on <b>how many kWh you have BOUGHT since the 1st of the month</b>. The tier counter resets every 1st.</p><ul><li><b>Tier 1</b> (0–150 kWh bought in the month): the lowest "social" price.</li><li><b>Tier 2</b> (above 150 kWh): much more expensive.</li><li>Above 250 kWh in the month, <b>18 % VAT</b> is added.</li><li>A <b>municipal tax</b> (about 2.5 %) applies to energy.</li></ul><div class="alert alert-amber"><span class="a-ic">⚠️</span><span><b>The trap</b>: kWh <b>bought</b> count, not kWh used. A big top-up on the 28th after buying a lot is charged at the high price; on the 1st the same money buys more kWh.</span></div>`],
['🤔 Why 15 kWh/day when it used to be 6?', `<ol><li><b>Heat</b>: from April to October AC and fans run much longer.</li><li><b>A tired fridge or freezer</b> that never stops.</li><li><b>New appliances</b> or habits.</li><li><b>Tiers</b>: buying more in a month raises the price of each kWh.</li><li><b>An electrical problem</b>: leakage, damaged wiring, neighbour connected, faulty meter.</li></ol><p>Compare <b>Estimated vs real</b> (History) then use <b>Detective mode</b>.</p>`],
['✍️ Recording balances and top-ups', `<ul><li>The <b>balance</b> is the kWh left shown on the meter.</li><li>Before each top-up, note the balance <b>BEFORE</b> typing the 20-digit token: that is how the app knows exactly what you used.</li><li>Started mid-month? Enter kWh already bought this month in <b>Tiers & tariffs</b>.</li><li>Best: one reading at a fixed time (morning). Evening + morning readings reveal night consumption.</li></ul>`],
['📈 How consumption is calculated', `<p>Between two points, consumption = <b>balance after the first point − balance before the second</b>. It is spread day by day; unusual days are shown in red. Estimated balance = last known balance − average use × time elapsed. Days left = estimated balance ÷ daily average.</p>`],
['🔌 Appliances', `<ul><li><b>Power (W)</b> is on the label. For AC look for "Input power".</li><li>Unknown? The <b>reference table</b> gives a typical value; size (HP, inches, litres) adjusts it.</li><li><b>Hours per day</b> matter most.</li><li><b>Advanced</b>: duty cycle (fridge ≈ 40 %, AC ≈ 80 %, inverter ≈ 45 %) and standby power.</li></ul>`],
['📷 Scan an appliance label', `<p>In an appliance form, tap <b>📷 Scan the label</b> and photograph the rating plate (usually on the back or underneath). The app reads the power and fills in "Power (W)".</p><ul><li>It looks for "W" or "kW". For AC it takes the <b>input power</b>, not the cooling capacity.</li><li>Amps only? It computes <b>W = 220 V × A</b>, a maximum.</li><li>Good light, no direct flash, sharp close-up photo.</li><li>First time: downloads the reader (≈ 5 MB, internet needed), then works offline. The photo stays on your phone.</li><li>Always check the value before saving.</li></ul>`],
['📝 Describe appliances in text', `<p>Write naturally: <code>2 Samsung TVs 43 inches 5h, 1 LG AC 1.5 HP inverter 8h, 3 fans 10h</code>. Precise format: <code>Qty | Type | Brand | Model | W | hours/day</code>. The "🤖 AI" button copies a ready prompt for Claude or Gemini.</p>`],
['🧮 Calculator and receipt checker', `<p><b>Calculator</b>: amount → kWh now vs on the 1st, or kWh → amount, plus the maximum to stay in your tier. <b>Checker</b>: enter amount paid and kWh received; the app compares with the official grid, explains where the money went and can calibrate your grid from a detailed receipt.</p>`],
['🕵️ Detective mode', `<ol><li>Find the meter's LED (marked "imp/kWh", usually 1000 or 1600) and set it in Settings.</li><li>Switch everything off and measure the <b>base</b> by tapping at each blink for 30 s. It should be below 15 W.</li><li>Switch on <b>one</b> appliance and measure it.</li><li>Much higher than expected = suspect appliance. Tap "Apply" to update the inventory.</li></ol>`],
['🌙 Standby hunt', `<p>Decoders, TVs, consoles, speakers use power even when off. See the monthly and yearly cost and tick what you can unplug.</p>`],
['🛒 Purchase simulator', `<p>Compare two models (power, hours, price) and see the monthly running cost and payback time.</p>`],
['👥 Meters and bill sharing', `<p>Add several meters (home, shop…). Bill sharing splits the month's amount by each person's appliances and prepares a WhatsApp message.</p>`],
['🔔 Reminders', `<p>No notifications: reminders appear when you open the app (credit running out, tier limit, wait for the 1st, unusual day, old reading, budget, backup). Tap ✕ to hide one until tomorrow.</p>`],
['💰 Editing the tariff grid', `<p>Defaults are the official Senelec tariffs (CRSE grids, 1 January 2026). If prices change, edit tiers, VAT, municipal tax, fixed fee and stamp in <b>Settings → Tariff grid</b>, or reset to official prices.</p>`],
['💾 Backup and new phone', `<p>Data stays on your phone. Export a backup file regularly. On a new phone: install, request a new activation code, then import your file.</p>`],
['📲 Install the app', installHelp],
['🔑 Activation', `<p>Each phone has a <b>device code</b> (e.g. PL-7KQ2-M9XA). Send it on WhatsApp to ${CONTACT_FMT} to receive your activation code, or scan the seller's QR code.</p><p><b>Free trial:</b> on the activation screen, tap "Start the free trial" to use the app for 24 hours without a code (once per phone). Afterwards an activation code is required; your data is kept.</p>`]
],
wo: [
['🚀 Tàmbali ci 5 simili', `<ol><li><b>Tànnal sa kontöör</b> ci kaw (📍), def ko tur (Kër, Bitik…).</li>
<li><b>Yokkal say jumtukaay</b> ci <b>Appareils</b>. Gaaw na : « 📝 Bind ko » te bind lu mel ni <code>2 tele Samsung 43 pouces 5h, 1 klim LG 1,5 CV inverter 8h, 3 ventilatoor, 1 frigo bu màggat</code>.</li>
<li><b>Bindal sa solde</b> : xoolal ekraanu kontöör bi te bës « ✍️ Bind sama solde ».</li>
<li><b>Saa yu nekk nga recharge</b> : laata ngay bind kod bi, bindal solde bi des ; te bindal xaalis bi ak kWh yi nga jot.</li>
<li><b>Bindal sa solde benn bés ba ñett bés</b> (suba, misaal). Appli bi dina waññi sa conso bu wóor ak fan yi des.</li></ol>`],
['📶 Naka la tranche yi di doxe ?', `<p>Njëgu kWh bi dafa aju ci <b>ñaata kWh nga JËNDE ci weer wi</b>, li dale ci 1 bi. Bu weer bu bees tàmbalee, tranche yi dañuy delloo ci zéro.</p>
<ul><li><b>Tranche 1</b> (0 ba 150 kWh ci weer wi) : njëg li gën a yomb.</li><li><b>Tranche 2</b> (lu ëpp 150 kWh) : kWh bi dafa gën a jafe.</li><li>Lu ëpp 250 kWh ci weer wi, <b>TVA 18 %</b> dina ci yokku.</li></ul>
<div class="alert alert-amber"><span class="a-ic">⚠️</span><span>KWh yi nga <b>jënd</b> ñoo am solo, du yi nga jëfandikoo. Recharge bu mag ci 28 bi dina la jafe : ci 1 bi, xaalis bi dina la may kWh yu ëpp.</span></div>`],
['🤔 Lu tax may lekk 15 kWh ci bés ?', `<ol><li><b>Tàng gi</b> : klim ak ventilatoor yi dañuy gën a dox.</li><li><b>Frigo bu sonn</b> te du taxaw.</li><li><b>Jumtukaay bu bees</b>.</li><li><b>Tranche yi</b> : soo gën a jënd ci weer wi, kWh bi dina gën a jafe.</li><li><b>Jafe-jafe ci kuraŋ bi</b> : fil bu yàqu, dëkkandoo bu la song, kontöör bu yàqu.</li></ol><p>Jëfandikool <b>Mode détective</b>.</p>`],
['📷 Scanner étiquette jumtukaay', `<p>Ci formulaire jumtukaay bi, bësal <b>📷 Scanner étiquette bi</b> te fotoo étiquette bi (ci ginaaw walla ci suuf). Appli bi dina jàng puissance bi te bind ko ci « Puissance (W) ».</p><ul><li>Dafay seet « W » walla « kW ». Su amul lu dul « A », dafay xayma : <b>W = 220 V × A</b>.</li><li>Leer bu baax, foto bu set te jege.</li><li>Bu jëkk bi, internet war na am (≈ 5 Mo), bu ko defee dina dox te internet amul.</li><li>Seetal lim bi balaa ngay denc.</li></ul>`],
['🕵️ Mode détective', `<ol><li>Seetal leer bi ci kontöör bi (« imp/kWh »).</li><li>Fajal lépp te natt « base » bi : bës butoŋ bi saa yu leer bi fàqee, 30 saa.</li><li>Taalal <b>benn</b> jumtukaay rekk te natt ko.</li><li>Su ëppee lool, jumtukaay boobu moo am jafe-jafe.</li></ol>`],
['💾 Sauvegarde', `<p>Say done yépp ci sa telefon lañu nekk. Def « Exporter » benn yoon ci weer wi te yónnee sa bopp fichier bi (WhatsApp, e-mail).</p>`],
['📲 Installer appli bi', installHelp],
['🔑 Activation', `<p>Telefon bu nekk am na <b>code appareil</b> (misaal PL-7KQ2-M9XA). Yónneel ko ci WhatsApp ci ${CONTACT_FMT} ngir jot sa code d'activation.</p><p><b>Essai gratuit :</b> ci écran d'activation bi, bësal « Tàmbali essai gratuit bi » ngir jëfandikoo appli bi 24 waxtu te amul code (benn yoon rekk ci telefon bu nekk). Su jeexee, dinañu la laaj code d'activation ; say done dañuy des.</p>`],
['ℹ️ Guide bu mat sëkk', `<p>Guide bu mat sëkk bi ci français ak ci anglais la nekk : soppil làkk wi ci Réglages ngir jàng ko.</p>`]
]

  state.view = views[v] ? v : 'home';
  applyTheme();
  const l = getLic();
  if (l.sig) LIC_OK = await checkSig(l.sig);

})();
